
name: Build Widget APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/salary/widget
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cp salary_calculator_design_v3.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SalaryWidget"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.salary.widget'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.salary.widget'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Калькулятор зарплаты"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ShiftWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical"
              android:padding="14dp"
              android:gravity="center_vertical"
              android:background="#202733"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <TextView
                  android:id="@+id/widget_text"
                  android:text="Откройте калькулятор"
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:lineSpacingExtra="4dp"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="90dp"
              android:initialLayout="@layout/widget"
              android:updatePeriodMillis="1800000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          EOF

          cat > app/src/main/java/com/salary/widget/MainActivity.java <<'EOF'
          package com.salary.widget;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  WebView web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.addJavascriptInterface(new Bridge(this), "AndroidWidget");
                  web.loadUrl("file:///android_asset/index.html");
              }

              public static class Bridge {
                  private final Context context;

                  Bridge(Context c) {
                      context = c.getApplicationContext();
                  }

                  @JavascriptInterface
                  public void updateSchedule(String json) {
                      context.getSharedPreferences("widget_data", 0)
                          .edit()
                          .putString("state", json)
                          .apply();

                      AppWidgetManager manager =
                          AppWidgetManager.getInstance(context);

                      ComponentName component = new ComponentName(
                          context, ShiftWidgetProvider.class);

                      int[] ids = manager.getAppWidgetIds(component);

                      new ShiftWidgetProvider().onUpdate(context, manager, ids);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/salary/widget/ShiftWidgetProvider.java <<'EOF'
          package com.salary.widget;

          import android.appwidget.AppWidgetProvider;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.widget.RemoteViews;
          import android.content.Intent;
          import android.app.PendingIntent;

          import org.json.JSONObject;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.Calendar;

          public class ShiftWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(
                  Context context,
                  AppWidgetManager manager,
                  int[] ids
              ) {
                  String text = makeText(context);

                  for (int id : ids) {
                      RemoteViews views = new RemoteViews(
                          context.getPackageName(), R.layout.widget);

                      views.setTextViewText(R.id.widget_text, text);

                      Intent intent = new Intent(context, MainActivity.class);

                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          context,
                          0,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                      views.setOnClickPendingIntent(
                          R.id.widget_text, pendingIntent);

                      manager.updateAppWidget(id, views);
                  }
              }

              private String makeText(Context context) {
                  String date = new SimpleDateFormat(
                      "EEE, d MMM", Locale.getDefault()
                  ).format(new Date());

                  String raw = context.getSharedPreferences(
                      "widget_data", 0
                  ).getString("state", "");

                  if (raw.isEmpty()) {
                      return "ГРАФИК СМЕН\n" + date +
                          "\nОткройте приложение и сохраните график";
                  }

                  try {
                      JSONObject state = new JSONObject(raw);

                      String start = state.optString("cycleStart", "");
                      int work = state.optInt("workDays", 3);
                      int off = state.optInt("offDays", 2);

                      if (start.isEmpty() || work < 1 || off < 1) {
                          return "ГРАФИК СМЕН\n" + date +
                              "\nПроверьте настройки графика";
                      }

                      Calendar base = parseDate(start);

                      if (base == null) {
                          return "ГРАФИК СМЕН\n" + date +
                              "\nНе удалось прочитать дату начала цикла";
                      }

                      Calendar today = Calendar.getInstance();

                      clearTime(base);
                      clearTime(today);

                      long days = Math.round(
                          (today.getTimeInMillis() -
                           base.getTimeInMillis()) / 86400000.0
                      );

                      int cycleLength = work + off;
                      int cycleDay = (int)(
                          ((days % cycleLength) + cycleLength) %
                          cycleLength
                      );

                      boolean working = cycleDay < work;

                      String status = working
                          ? "РАБОЧАЯ СМЕНА"
                          : "ВЫХОДНОЙ";

                      String startTime = state.optString("shiftStart", "");
                      String endTime = state.optString("shiftEnd", "");

                      if (working &&
                          !startTime.isEmpty() &&
                          !endTime.isEmpty()) {
                          status += "\n" + startTime + " – " + endTime;
                      }

                      return "ГРАФИК СМЕН\n" + date + "\n" + status;

                  } catch (Exception e) {
                      return "ГРАФИК СМЕН\n" + date +
                          "\nНе удалось прочитать график";
                  }
              }

              private static void clearTime(Calendar c) {
                  c.set(Calendar.HOUR_OF_DAY, 0);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
              }

              private static Calendar parseDate(String value) {
                  String[] formats = {
                      "yyyy-MM-dd",
                      "dd.MM.yyyy",
                      "yyyy-MM-dd'T'HH:mm:ss"
                  };

                  for (String format : formats) {
                      try {
                          SimpleDateFormat sdf = new SimpleDateFormat(
                              format, Locale.US);
                          sdf.setLenient(false);

                          Date date = sdf.parse(value);

                          if (date != null) {
                              Calendar c = Calendar.getInstance();
                              c.setTime(date);
                              return c;
                          }
                      } catch (Exception ignored) {
                      }
                  }

                  return null;
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/assets/index.html")
          html = p.read_text(encoding="utf-8")

          bridge = r"""
          <script>
          (function () {
            function sendSchedule(value) {
              try {
                if (value && window.AndroidWidget) {
                  window.AndroidWidget.updateSchedule(value);
                }
              } catch (e) {}
            }

            try {
              var originalSetItem = Storage.prototype.setItem;

              Storage.prototype.setItem = function (key, value) {
                originalSetItem.call(this, key, value);

                if (key === 'shiftCalendar3x2_v1') {
                  sendSchedule(value);
                }
              };

              sendSchedule(
                localStorage.getItem('shiftCalendar3x2_v1')
              );
            } catch (e) {}

            window.addEventListener('pageshow', function () {
              try {
                sendSchedule(
                  localStorage.getItem('shiftCalendar3x2_v1')
                );
              } catch (e) {}
            });
          })();
          </script>
          """

          pos = html.lower().rfind("</body>")

          if pos < 0:
              raise SystemExit("Не найден закрывающий тег body в HTML")

          html = html[:pos] + bridge + html[pos:]
          p.write_text(html, encoding="utf-8")
          PY

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salary-widget-apk-v3
          path: app/build/outputs/apk/debug/app-debug.apk
